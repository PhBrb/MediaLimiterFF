<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaLimiter Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1>MediaLimiter Settings</h1>

  <section>
    <h2>Time limit per rolling hour</h2>
    <label for="limitMinutes">YouTube Shorts limit (minutes)</label>
    <input type="number" id="limitMinutes" min="1" max="60" step="1" inputmode="numeric">
    <p class="hint">Default: 10 minutes. The limit applies to a rolling 60-minute window.</p>
  </section>

  <section>
    <h2>Additional websites</h2>
    <p class="hint">Every visit to a listed website charges <span id="siteCostDisplay">30</span> seconds against the same time limit.</p>
    <label for="newSite">Add website</label>
    <div class="add-row">
      <input type="text" id="newSite" placeholder="example.com">
      <button id="addSite">Add</button>
    </div>
    <ul id="siteList"></ul>
  </section>

  <section>
    <h2>Current usage</h2>
    <p id="usageDisplay">Loading…</p>
    <button id="resetUsage">Reset usage</button>
  </section>

  <p id="status" role="status"></p>

  <script src="options.js"></script>
</body>
</html>
